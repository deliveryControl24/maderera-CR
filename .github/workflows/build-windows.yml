name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      make_release:
        description: "Crear release de GitHub con el EXE"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pyinstaller pillow openpyxl

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name PINO_SYSTEM `
            --icon pino.ico `
            --add-data "pino.ico;." `
            --add-data "pino_icon.png;." `
            --hidden-import openpyxl `
            --hidden-import openpyxl.cell._writer `
            --collect-all openpyxl `
            app.py

      - name: Check EXE
        shell: pwsh
        run: |
          if (-not (Test-Path dist/PINO_SYSTEM.exe)) { throw "No se genero el EXE" }
          Get-Item dist/PINO_SYSTEM.exe | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PINO_SYSTEM
          path: dist/PINO_SYSTEM.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PINO_SYSTEM.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Create Release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.make_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: PINO_SYSTEM build ${{ github.run_number }}
          files: dist/PINO_SYSTEM.exe
          generate_release_notes: true
